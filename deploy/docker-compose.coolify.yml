services:
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    expose:
      - '80'
    volumes:
      - lucrum_data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    command: ['sleep', 'infinity']
    environment:
      LUCRUM_REQUESTS_PER_SECOND: '${LUCRUM_REQUESTS_PER_SECOND:-2.5}'
      MAX_ATTEMPTS: '${MAX_ATTEMPTS:-3}'
      RETRY_SECONDS: '${RETRY_SECONDS:-300}'
    volumes:
      - lucrum_data:/app/data

volumes:
  lucrum_data:
  caddy_data:
  caddy_config:
